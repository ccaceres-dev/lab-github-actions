name: Full DevOps Pipeline
run-name: Pipeline ejecutado por ${{ github.actor }} 🚀

on:
  push:
    branches: [ "main" ]

jobs:
  # --- ETAPA 1: AUDITORÍA ---
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar PyYAML
        run: pip install PyYAML
      - name: Validar Manifiestos K8s
        run: python scripts/audit_k8s.py
        env:
          AUDITOR: ${{ github.actor }}

  # --- ETAPA 2: "CONSTRUCCIÓN" (Simulada) ---
  build:
    needs: auditoria # Solo corre si la auditoría pasó
    runs-on: ubuntu-latest
    steps:
      - name: Simular Build de Imagen
        run: |
          echo "Construyendo imagen glpi:11.0.4..."
          echo "Imagen subida al registro con tag: ${{ github.sha }}"

  # --- ETAPA 3: DESPLIEGUE A STAGING ---
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Desplegar en Cluster de Pruebas
        run: |
          echo "Ejecutando: kubectl apply -f k8s/deployment.yaml"
          echo "Despliegue en Staging completado."

  # --- ETAPA 4: DESPLIEGUE A PRODUCCIÓN (Con aprobación manual) ---
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # Aquí podrías configurar en GitHub que requiera aprobación
    steps:
      - name: Desplegar en Producción
        run: |
          echo "🚀 Desplegando en el cluster de producción..."
          echo "Versión ${{ github.sha }} en vivo."
