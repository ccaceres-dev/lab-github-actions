name: CI-Infra-Auditor
run-name: Auditoría por ${{ github.actor }} 🛡️

on: [push]

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar PyYAML
        run: pip install PyYAML
        
      - name: Ejecutar Auditoría Técnica
        run: python scripts/audit_k8s.py
        env:
          AUDITOR: ${{ github.actor }}
