apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  labels:
    app: nginx-app
spec:
  replicas: 2 # Probaremos con 2 para ver el escalado
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx-main
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"
          requests:
            cpu: "250m"
            memory: "64Mi"
